<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Карта Ошмянского уезда 1850</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #f4ece1;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        .container {
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }
        .header-panel {
            background-color: #2c3e50;
            color: #fff;
            padding: 12px;
            text-align: center;
            font-size: 15px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            z-index: 10;
        }
        #map-container {
            flex: 1;
            position: relative;
            background-color: #e5d3b3;
            overflow: hidden;
        }
        #map-viewport {
            width: 2000px;
            height: 1600px;
            position: absolute;
            transform-origin: 0 0;
            background-color: #e5d3b3;
            left: 0;
            top: 0;
        }
        #map-svg {
            width: 100%;
            height: 100%;
        }
        .grid-line {
            fill: none;
            stroke: #d4bfa2;
            stroke-width: 1;
        }
        .village-marker {
            fill: #d32f2f;
            stroke: #fff;
            stroke-width: 2;
            cursor: pointer;
        }
        .village-label {
            fill: #3e2723;
            font-size: 14px;
            font-weight: bold;
            text-anchor: middle;
            pointer-events: none;
        }
        
        /* НАДЕЖНЫЙ ПУЛЬТ УПРАВЛЕНИЯ КНОПКАМИ */
        .control-panel {
            position: absolute;
            right: 15px;
            bottom: 25px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 999;
        }
        .control-row {
            display: flex;
            gap: 8px;
            justify-content: center;
        }
        .control-btn {
            width: 46px;
            height: 46px;
            background-color: #2c3e50;
            color: white;
            border: 2px solid #fff;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .control-btn:active {
            background-color: #34495e;
        }

        /* Шторка архивных данных */
        .info-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.2);
            padding: 16px;
            transform: translateY(100%);
            transition: transform 0.3s ease-out;
            z-index: 1000;
            max-height: 50%;
            overflow-y: auto;
        }
        .info-panel.active {
            transform: translateY(0);
        }
        .close-btn {
            float: right;
            background: #eee;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .popup-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #2c3e50;
        }
        .popup-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            margin-top: 10px;
        }
        .popup-table th, .popup-table td {
            border: 1px solid #e0e0e0;
            padding: 8px;
            text-align: left;
        }
        .popup-table th {
            background-color: #f5f5f5;
            color: #2c3e50;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-panel">🗺️ Генеалогический архив Ошмянского уезда</div>
        
        <div id="map-container">
            <!-- Исправленный пульт управления в виде аккуратных рядов -->
            <div class="control-panel">
                <div class="control-row">
                    <div class="control-btn" id="btn-zoom-in">+</div>
                    <div class="control-btn" id="btn-zoom-out">−</div>
                </div>
                <div class="control-row">
                    <div class="control-btn" id="btn-move-up">▲</div>
                </div>
                <div class="control-row">
                    <div class="control-btn" id="btn-move-left">◀</div>
                    <div class="control-btn" id="btn-move-down">▼</div>
                    <div class="control-btn" id="btn-move-right">▶</div>
                </div>
            </div>

            <div id="map-viewport">
                <svg id="map-svg">
                    <defs>
                        <pattern id="map-grid" width="60" height="60" patternUnits="userSpaceOnUse">
                            <path d="M 60 0 L 0 0 0 60" class="grid-line"/>
                        </pattern>
                    </defs>
                    <rect width="100%" height="100%" fill="url(#map-grid)" />
                    <path d="M 50 200 Q 400 350 800 200 T 1800 300" fill="none" stroke="#a0c4ff" stroke-width="5" opacity="0.7"/>
                    
                    <g id="historic-places">
                        <circle cx="300" cy="400" r="12" class="village-marker" onclick="openArchive('Поляны')"/>
                        <text x="300" y="375" class="village-label">Поляны</text>

                        <circle cx="550" cy="320" r="12" class="village-marker" onclick="openArchive('Клопаче')"/>
                        <text x="550" y="295" class="village-label">Клопаче</text>

                        <circle cx="750" cy="500" r="12" class="village-marker" onclick="openArchive('Тальковщизна')"/>
                        <text x="750" y="475" class="village-label">Тальковщизна</text>

                        <circle cx="600" cy="750" r="12" class="village-marker" onclick="openArchive('Вишнево')"/>
                        <text x="600" y="725" class="village-label">Вишнево</text>

                        <circle cx="1100" cy="350" r="12" class="village-marker" onclick="openArchive('Сураж')"/>
                        <text x="1100" y="325" class="village-label">Сураж</text>
                    </g>
                </svg>
            </div>
        </div>

        <div id="info-panel" class="info-panel">
            <button class="close-btn" onclick="closePanel()">✕</button>
            <div id="panel-content"></div>
        </div>
    </div>

    <script>
        const archiveDatabase = {
            "Поляны": [
                { type: "двор", fond: "515", delo: "866", pages: "3об-4", owner: "Иосиф Улан", estate: "Клопаче" },
                { type: "фольварок", fond: "515", delo: "866", pages: "21об-22", owner: "Авраам Улан", estate: "Поляны" }
            ],
            "Клопаче": [
                { type: "деревня", fond: "515", delo: "866", pages: "3об-5", owner: "Иосиф Улан", estate: "Клопаче" },
                { type: "деревня", fond: "515", delo: "866", pages: "21об-22", owner: "Авраам Улан", estate: "Поляны" }
            ],
            "Тальковщизна": [
                { type: "деревня", fond: "515", delo: "866", pages: "13об-16", owner: "Томаш Умястовский", estate: "Тальковщизна" }
            ],
            "Вишнево": [
                { type: "местечко", fond: "515", delo: "866", pages: "419об-424", owner: "Михаил Хрептович", estate: "Вишнево" }
            ],
            "Сураж": [
                { type: "деревня", fond: "515", delo: "866", pages: "29об-33", owner: "Антоний Умястовский", estate: "Бердовщизна" }
            ]
        };

        function openArchive(placeName) {
            const records = archiveDatabase[placeName];
            if (!records) return;

            const panel = document.getElementById('info-panel');
            const content = document.getElementById('panel-content');
            
            let html = `<div class="popup-title">📍 Документы по пункту: ${placeName}</div>`;
            html += `<table class="popup-table">
                        <thead>
                            <tr>
                                <th>Статус</th>
                                <th>Архивный шифр</th>
                                <th>Листы дела</th>
                                <th>Помещик / Имение</th>
                            </tr>
                        </thead>
                        <tbody>`;
            
            records.forEach(rec => {
                html += `<tr>
                            <td><b>${rec.type}</b></td>
                            <td>Ф. ${rec.fond}, оп. 15, д. ${rec.delo}</td>
                            <td>л. ${rec.pages}</td>
                            <td>${rec.owner}<br><span style="color:#795548; font-size:11px;">им. ${rec.estate}</span></td>
                         </tr>`;
            });
            html += `</tbody></table>`;
            
            content.innerHTML = html;
            panel.classList.add('active');
        }

        function closePanel() {
            document.getElementById('info-panel').classList.remove('active');
        }

        // --- НАВИГАЦИОННЫЙ СКРИПТ ПОЛНОСТЬЮ НА JS-СОБЫТИЯХ ---
        const viewport = document.getElementById('map-viewport');
        
        let translateX = -150;
