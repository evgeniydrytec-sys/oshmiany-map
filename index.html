<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Карта Ошмянского уезда 1850</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #f4f4f4;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }
        .container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .header-panel {
            background-color: #4285F4; /* Фирменный синий цвет Google */
            color: #fff;
            padding: 12px;
            text-align: center;
            font-size: 15px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 10;
        }
        .map-wrapper {
            flex: 1;
            position: relative;
            width: 100%;
            height: 100%;
        }
        /* Стили для фрейма Google Карты */
        #google-map {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-panel">🗺️ Архивный сервис: Ошмянский повет (Google Карты)</div>
        
        <div class="map-wrapper">
            <!-- Официальное встраивание Google Карт, адаптированное под Telegram.
                 Центр установлен на Ошмяны (координаты 54.4249, 25.9356) -->
            <iframe 
                id="google-map"
                src="https://google.com" 
                allowfullscreen="" 
                loading="lazy" 
                referrerpolicy="no-referrer-when-downgrade">
            </iframe>
        </div>
    </div>

</body>
</html>
