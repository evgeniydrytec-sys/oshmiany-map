<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Карта Ошмянского уезда</title>
    
    <!-- Вшиваем стили Leaflet напрямую, чтобы Telegram не блокировал внешние CSS файлы -->
    <style>
        /* Исходные стили Leaflet ядра */
        .leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-map-pane svg,.leaflet-map-pane canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}.leaflet-container{overflow:hidden;-ms-touch-action:none;touch-action:none;cursor:grab;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-zoom:transparent}.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow{-webkit-user-drag:none;user-drag:none}.leaflet-tile{filter:inherit;visibility:hidden}.leaflet-tile-loaded{visibility:inherit}.leaflet-zoom-box{width:0;height:0;-moz-box-sizing:border-box;box-sizing:border-box;z-index:800}.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-shadow-pane{z-index:500}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}.leaflet-map-pane canvas{z-index:100}.leaflet-map-pane svg{z-index:200}.leaflet-vml-shape{width:1px;height:1px}.lvml{behavior:url(#default#VML);display:inline-block;position:absolute}.leaflet-control{position:relative;z-index:800;pointer-events:auto}.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}.leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}.leaflet-control{float:left;clear:both}.leaflet-right .leaflet-control{float:right}.leaflet-top .leaflet-control{margin-top:10px}.leaflet-bottom .leaflet-control{margin-bottom:10px}.leaflet-left .leaflet-control{margin-left:10px}.leaflet-right .leaflet-control{margin-right:10px}
        
        /* Стили нашего интерфейса */
        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #f4f4f4;
        }
        .container { display: flex; flex-direction: column; height: 100%; }
        .header-panel {
            background-color: #2c3e50; color: #fff; padding: 12px;
            text-align: center; font-size: 15px; font-weight: bold; z-index: 1000;
        }
        #map { flex: 1; width: 100%; height: 100%; z-index: 1; }
        
        /* Красивое оформление таблиц документов в балунах */
        .popup-table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 5px; }
        .popup-table th, .popup-table td { border: 1px solid #ddd; padding: 5px; text-align: left; }
        .popup-table th { background-color: #f4f4f4; font-weight: bold; }
        .popup-title { font-size: 13px; font-weight: bold; margin: 0 0 5px 0; color: #2c3e50; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-panel">🗺️ Настоящая карта: Ошмянский повет (1850)</div>
        <div id="map"></div>
    </div>

    <!-- Загружаем Leaflet через ESM-модуль. Это самый современный и безопасный метод, защищенный от блокировок Telegram -->
    <script type="module">
        import 'https://jsdelivr.net';

        window.addEventListener('DOMContentLoaded', () => {
            // Ждем долей секунды, пока модуль Leaflet полностью развернется в памяти телефона
            setTimeout(() => {
                try {
                    // 1. Инициализация НАСТОЯЩЕЙ карты на Ошмяны
                    const map = L.map('map').setView([54.4231, 25.9357], 10);

                    # 2. Подключаем НАСТОЯЩИЙ мировой сервер карт (CartoDB Voyager)
                    # Он детальный, быстрый и полностью легален для работы в РБ без VPN
                    L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png', {
                        maxZoom: 19,
                        attribution: '© OpenStreetMap'
                    }).addTo(map);

                    // 3. Реальные географические координаты для теста (Поляны, Клопаче, Вишнево)
                    const rawRecords = [
                        { fond: "515", delo: "866", pages: "3об-4", owner: "Иосиф Улан", estate: "Клопаче", type: "двор", place: "Поляны", lat: 54.4512, lng: 25.9144 },
                        { fond: "515", delo: "866", pages: "3об-5", owner: "Иосиф Улан", estate: "Клопаче", type: "деревня", place: "Клопаче", lat: 54.4120, lng: 25.9611 },
                        { fond: "515", delo: "866", pages: "419об-424", owner: "Михаил Хрептович", estate: "Вишнево", type: "местечко", place: "Вишнево", lat: 54.1411, lng: 26.2139 }
                    ];

                    // 4. Автоматическая группировка данных по точкам
                    const placesOnMap = {};
                    rawRecords.forEach(row => {
                        const key = `${row.type} ${row.place}`.trim();
                        if (!placesOnMap[key]) {
                            placesOnMap[key] = {
                                name: row.place, type: row.type, lat: row.lat, lng: row.lng, records: []
                            };
                        }
                        placesOnMap[key].records.push(row);
                    });

                    // 5. Отрисовка маркеров на НАСТОЯЩЕЙ карте местности
                    for (const key in placesOnMap) {
                        const data = placesOnMap[key];
                        const marker = L.marker([data.lat, data.lng]).addTo(map);

                        let popupContent = `<div class="popup-title">📍 ${data.type} ${data.name}</div>`;
                        popupContent += `<table class="popup-table">
                                            <thead>
                                                <tr>
                                                    <th>Шифр</th>
                                                    <th>Листы</th>
                                                    <th>Помещик / Имение</th>
                                                </tr>
                                            </thead>
                                            <tbody>`;

                        data.records.forEach(rec => {
                            popupContent += `<tr>
                                                <td>Ф.${rec.fond}, д.${rec.delo}</td>
                                                <td>л.${rec.pages}</td>
                                                <td>${rec.owner}<br><small style="color:gray">им. ${rec.estate}</small></td>
                                             </tr>`;
                        });
                        popupContent += `</tbody></table>`;
                        
                        marker.bindPopup(popupContent, { maxWidth: 360 });
                    }

                } catch (err) {
                    console.error("Ошибка загрузки настоящей карты местности:", err);
                }
            }, 300);
        });
    </script>
</body>
</html>
