<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Архив Ошмянского уезда</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #f4ece1;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            overflow: hidden;
        }
        .container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .header-panel {
            background-color: #2c3e50;
            color: #fff;
            padding: 12px;
            text-align: center;
            font-size: 15px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        
        /* ПАНЕЛЬ ВЫБОРА НАСЕЛЕННОГО ПУНКТА */
        .search-panel {
            background-color: #fff;
            padding: 10px;
            border-bottom: 1px solid #d4bfa2;
            display: flex;
            gap: 8px;
            overflow-x: auto; /* Позволяет листать список деревень пальцем влево-вправо */
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
        }
        .place-link {
            display: inline-block;
            background-color: #f5f5f5;
            color: #2c3e50;
            padding: 8px 14px;
            border: 1px solid #ccc;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }
        .place-link:active {
            background-color: #d32f2f;
            color: white;
            border-color: #d32f2f;
        }

        #map-container {
            flex: 1;
            position: relative;
            background-color: #e5d3b3;
            overflow: hidden;
        }
        #map-viewport {
            width: 100%;
            height: 100%;
            background-color: #e5d3b3;
        }
        #map-svg {
            width: 100%;
            height: 100%;
        }
        .grid-line {
            fill: none;
            stroke: #d4bfa2;
            stroke-width: 1;
        }
        .village-marker {
            fill: #d32f2f;
            stroke: #fff;
            stroke-width: 2;
        }
        .village-label {
            fill: #3e2723;
            font-size: 14px;
            font-weight: bold;
            text-anchor: middle;
        }

        /* Таблица архивных данных (постоянно видимая снизу) */
        .info-panel {
            background: white;
            border-top: 3px solid #2c3e50;
            padding: 14px;
            height: 40%;
            overflow-y: auto;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.1);
        }
        .popup-title {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #2c3e50;
            border-bottom: 2px solid #f5f5f5;
            padding-bottom: 4px;
        }
        .popup-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        .popup-table th, .popup-table td {
            border: 1px solid #e0e0e0;
            padding: 6px;
            text-align: left;
        }
        .popup-table th {
            background-color: #f5f5f5;
            color: #2c3e50;
        }
        .hint-text {
            color: #7f8c8d;
            text-align: center;
            margin-top: 30px;
            font-style: italic;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-panel">📜 Архивный сервис: Ошмянский повет (1850)</div>
        
        <!-- Горизонтальный список населенных пунктов. Нажатие НА КНОПКУ запустит код на 100% -->
        <div class="search-panel">
            <div class="place-link" onclick="showArchiveData('Поляны')">📍 Поляны</div>
            <div class="place-link" onclick="showArchiveData('Клопаче')">📍 Клопаче</div>
            <div class="place-link" onclick="showArchiveData('Тальковщизна')">📍 Тальковщизна</div>
            <div class="place-link" onclick="showArchiveData('Вишнево')">📍 Вишнево</div>
            <div class="place-link" onclick="showArchiveData('Сураж')">📍 Сураж</div>
        </div>
        
        <!-- Карта, которая теперь просто визуально отображает сетку региона -->
        <div id="map-container">
            <div id="map-viewport">
                <svg id="map-svg" viewBox="0 0 800 500">
                    <defs>
                        <pattern id="map-grid" width="50" height="50" patternUnits="userSpaceOnUse">
                            <path d="M 50 0 L 0 0 0 50" class="grid-line"/>
                        </pattern>
                    </defs>
                    <rect width="100%" height="100%" fill="url(#map-grid)" />
                    <path d="M 50 150 Q 350 250 550 120 T 800 200" fill="none" stroke="#a0c4ff" stroke-width="4" opacity="0.7"/>
                    
                    <!-- Статичные точки на карте -->
                    <circle cx="250" cy="220" r="9" class="village-marker" id="mark-Поляны"/>
                    <text x="250" y="200" class="village-label">Поляны</text>

                    <circle cx="380" cy="180" r="9" class="village-marker" id="mark-Клопаче"/>
                    <text x="380" y="160" class="village-label">Клопаче</text>

                    <circle cx="520" cy="280" r="9" class="village-marker" id="mark-Тальковщизна"/>
                    <text x="520" y="260" class="village-label">Тальковщизна</text>

                    <circle cx="450" cy="380" r="9" class="village-marker" id="mark-Вишнево"/>
                    <text x="450" y="360" class="village-label">Вишнево</text>

                    <circle cx="680" cy="190" r="9" class="village-marker" id="mark-Сураж"/>
                    <text x="680" y="170" class="village-label">Сураж</text>
                </svg>
            </div>
        </div>

        <!-- Нижнее окно данных, которое теперь постоянно на экране и ждет выбора селения -->
        <div id="info-panel" class="info-panel">
            <div id="panel-content">
                <div class="hint-text">💡 Нажмите на название населенного пункта в верхнем меню, чтобы просмотреть архивные документы 1850 года.</div>
            </div>
        </div>
    </div>

    <script>
        const archiveDatabase = {
            "Поляны": [
                { type: "двор", fond: "515", delo: "866", pages: "3об-4", owner: "Иосиф Улан", estate: "Клопаче" },
                { type: "фольварок", fond: "515", delo: "866", pages: "21об-22", owner: "Авраам Улан", estate: "Поляны" }
            ],
            "Клопаче": [
                { type: "деревня", fond: "515", delo: "866", pages: "3об-5", owner: "Иосиф Улан", estate: "Клопаче" },
                { type: "деревня", fond: "515", delo: "866", pages: "21об-22", owner: "Авраам Улан", estate: "Поляны" }
            ],
            "Тальковщизна": [
                { type: "деревня", fond: "515", delo: "866", pages: "13об-16", owner: "Томаш Умястовский", estate: "Тальковщизна" }
            ],
            "Вишнево": [
                { type: "местечко", fond: "515", delo: "866", pages: "419об-424", owner: "Михаил Хрептович", estate: "Вишнево" }
            ],
            "Сураж": [
                { type: "деревня", fond: "515", delo: "866", pages: "29об-33", owner: "Антоний Умястовский", estate: "Бердовщизна" }
            ]
        };

        // Эта функция гарантированно сработает, так как кликаются обычные стандартные HTML-кнопки сверху страницы!
        function showArchiveData(placeName) {
            const records = archiveDatabase[placeName];
            if (!records) return;

            const content = document.getElementById('panel-content');
            
            // Сбрасываем цвета всех точек и подсвечиваем выбранную
            const markers = document.querySelectorAll('.village-marker');
            markers.forEach(m => m.style.fill = '#d32f2f');
            
            const activeMarker = document.getElementById('mark-' + placeName);
            if (activeMarker) activeMarker.style.fill = '#1565c0'; // Красим выбранную в синий

            // Генерируем таблицу документов
            let html = `<div class="popup-title">📍 Документы по пункту: <b>${placeName}</b></div>`;
            html += `<table class="popup-table">
                        <thead>
                            <tr>
                                <th>Тип</th>
                                <th>Архивный шифр</th>
                                <th>Листы дела</th>
                                <th>Помещик / Имение</th>
                            </tr>
                        </thead>
                        <tbody>`;
            
            records.forEach(rec => {
                html += `<tr>
                            <td><b>${rec.type}</b></td>
                            <td>Ф. ${rec.fond}, оп. 15, д. ${rec.delo}</td>
                            <td>л. ${rec.pages}</td>
                            <td>${rec.owner}<br><span style="color:#795548; font-size:11px;">им. ${rec.estate}</span></td>
                         </tr>`;
            });
            html += `</tbody></table>`;
            
            content.innerHTML = html;
        }
    </script>
</body>
</html>
