<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карта Ошмянского уезда 1850</title>
    
    <!-- Подключаем API Яндекс.Карт — супернадежно и без скачивания файлов -->
    <script src="https://yandex.ru" type="text/javascript"></script>
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
        }
        #map {
            width: 100%;
            height: 100%;
        }
        .popup-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 5px;
            font-size: 11px;
        }
        .popup-table th, .popup-table td {
            border: 1px solid #ddd;
            padding: 5px;
            text-align: left;
        }
        .popup-table th {
            background-color: #f4f4f4;
            font-weight: bold;
        }
        .popup-title {
            font-size: 14px;
            margin: 0 0 5px 0;
            font-weight: bold;
            color: #222;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script type="text/javascript">
        // Ожидаем полную загрузку API Яндекс.Карт
        ymaps.ready(init);
        
        function init() {
            // 1. Создание карты с центром в Ошмянах
            var myMap = new ymaps.Map("map", {
                center: [54.4231, 25.9357],
                zoom: 10,
                controls: ['zoomControl', 'typeSelector']
            });

            // 2. Тестовый массив архивных данных
            var rawRecords = [
                { fond: "515", opis: "15", delo: "866", pages: "3об-4", owner: "Иосиф Улан", estate: "Клопаче", type: "двор", place: "Поляны", url: "https://familysearch.org" },
                { fond: "515", opis: "15", delo: "866", pages: "3об-5", owner: "Иосиф Улан", estate: "Клопаче", type: "деревня", place: "Клопаче", url: "https://familysearch.org" },
                { fond: "515", opis: "15", delo: "866", pages: "13об-16", owner: "Томаш Геронимович Умястовский", estate: "Тальковщизна", type: "деревня", place: "Тальковщизна", url: "https://familysearch.org" },
                { fond: "515", opis: "15", delo: "866", pages: "21об-22", owner: "Авраам Матвеевич Улан", estate: "Поляны", type: "фольварок", place: "Поляны", url: "https://familysearch.org" },
                { fond: "515", opis: "15", delo: "866", pages: "21об-22", owner: "Авраам Матвеевич Улан", estate: "Поляны", type: "деревня", place: "Клопаче", url: "https://familysearch.org" },
                { fond: "515", opis: "15", delo: "866", pages: "29об-33", owner: "Антоний Яковлевич Умястовский", estate: "Бердовщизна", type: "деревня", place: "Сураж", url: "https://familysearch.org" },
                { fond: "515", opis: "15", delo: "866", pages: "419об-424", owner: "Михаил Геронимович Хрептович", estate: "Вишнево", type: "местечко", place: "Вишнево", url: "https://familysearch.org" }
            ];

            // 3. Автоматическая группировка дубликатов названий
            var placesOnMap = {};
            rawRecords.forEach(function(row) {
                var key = (row.type + " " + row.place).trim();
                if (!placesOnMap[key]) {
                    placesOnMap[key] = {
                        name: row.place,
                        type: row.type,
                        // Генерируем тестовые точки недалеко от Ошмян
                        lat: 54.4231 + (Math.random() - 0.5) * 0.15,
                        lng: 25.9357 + (Math.random() - 0.5) * 0.15,
                        records: []
                    };
                }
                placesOnMap[key].records.push(row);
            });

            // 4. Отрисовка маркеров на карте
            for (var key in placesOnMap) {
                var data = placesOnMap[key];

                // Формируем внутреннюю таблицу для всплывающего окна (балуна)
                var popupContent = '<div class="popup-title">' + data.type + ' ' + data.name + '</div>';
                popupContent += '<table class="popup-table">' +
                                    '<thead>' +
                                        '<tr>' +
                                            '<th>Шифр</th>' +
                                            '<th>Листы</th>' +
                                            '<th>Владелец / Имение</th>' +
                                            '<th>Ссылка</th>' +
                                        '</tr>' +
                                    '</thead>' +
                                    '<tbody>';

                data.records.forEach(function(rec) {
                    popupContent += '<tr>' +
                                        '<td>Ф. ' + rec.fond + ', оп. ' + rec.opis + ', д. ' + rec.delo + '</td>' +
                                        '<td>' + rec.pages + '</td>' +
                                        '<td>' + rec.owner + '<br><small style="color:gray">им. ' + rec.estate + '</small></td>' +
                                        '<td><a href="' + rec.url + '" target="_blank">Открыть ↗</a></td>' +
                                     '</tr>';
                });

                popupContent += '</tbody></table>';

                // Создаем саму метку на Яндекс.Картах
                var placemark = new ymaps.Placemark([data.lat, data.lng], {
                    balloonContentBody: popupContent, // Передаем нашу таблицу внутрь окна
                    hintContent: data.type + ' ' + data.name
                }, {
                    preset: 'islands#blueDotIcon' // Красивый синий значок
                });

                myMap.geoObjects.add(placemark);
            }
        }
    </script>
</body>
</html>
