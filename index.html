<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Карта Ошмянского уезда 1850</title>
    
    <!-- Используем зеркало Leaflet, полностью разрешенное внутренними политиками Telegram -->
    <link rel="stylesheet" href="https://jsdelivr.net" />
    <script src="https://jsdelivr.net"></script>
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #f4f4f4;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }
        .container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .header-panel {
            background-color: #2c3e50;
            color: #fff;
            padding: 12px;
            text-align: center;
            font-size: 15px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 1000;
        }
        #map {
            flex: 1;
            width: 100%;
            height: 100%;
        }
        /* Стили для архивной таблицы внутри маркеров */
        .popup-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
            margin-top: 5px;
        }
        .popup-table th, .popup-table td {
            border: 1px solid #ddd;
            padding: 5px;
            text-align: left;
        }
        .popup-table th {
            background-color: #f4f4f4;
            font-weight: bold;
        }
        .popup-title {
            font-size: 13px;
            font-weight: bold;
            margin: 0 0 5px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-panel">🗺️ Генеалогический архив Ошмянского уезда</div>
        <div id="map"></div>
    </div>

    <script>
        // Ждем загрузки окна, чтобы Telegram не блокировал скрипты
        window.addEventListener('load', function() {
            try {
                // 1. Создаем карту с центром в Ошмянах (Беларусь)
                // Координаты: широта 54.4231, долгота 25.9357
                var map = L.map('map', {
                    center: [54.4231, 25.9357],
                    zoom: 10,
                    zoomControl: true
                });

                // 2. Подключаем стабильную современную подложку карт (без блокировок в РБ и без VPN)
                L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png', {
                    maxZoom: 19,
                    attribution: '© OpenStreetMap'
                }).addTo(map);

                // 3. Тестовая база данных (Поляны, Клопаче, Вишнево)
                var rawRecords = [
                    { fond: "515", opis: "15", delo: "866", pages: "3об-4", owner: "Иосиф Улан", estate: "Клопаче", type: "двор", place: "Поляны", lat: 54.4500, lng: 25.9100, url: "https://familysearch.org" },
                    { fond: "515", opis: "15", delo: "866", pages: "3об-5", owner: "Иосиф Улан", estate: "Клопаче", type: "деревня", place: "Клопаче", lat: 54.4100, lng: 25.9600, url: "https://familysearch.org" },
                    { fond: "515", opis: "15", delo: "866", pages: "21об-22", owner: "Авраам Улан", estate: "Поляны", type: "фольварок", place: "Поляны", lat: 54.4550, lng: 25.9150, url: "https://familysearch.org" },
                    { fond: "515", opis: "15", delo: "866", pages: "419об-424", owner: "Михаил Хрептович", estate: "Вишнево", type: "местечко", place: "Вишнево", lat: 54.1411, lng: 26.2139, url: "https://familysearch.org" }
                ];

                // 4. Группируем записи, чтобы не плодить маркеры на одной точке
                var placesOnMap = {};
                rawRecords.forEach(function(row) {
                    var key = (row.type + " " + row.place).trim();
                    if (!placesOnMap[key]) {
                        placesOnMap[key] = {
                            name: row.place,
                            type: row.type,
                            lat: row.lat,
                            lng: row.lng,
                            records: []
                        };
                    }
                    placesOnMap[key].records.push(row);
                });

                // 5. Расставляем маркеры на реальной карте
                for (var key in placesOnMap) {
                    var data = placesOnMap[key];
                    
                    // Создаем маркер
                    var marker = L.marker([data.lat, data.lng]).addTo(map);

                    // Собираем таблицу документов
                    var popupContent = '<div class="popup-title">📍 ' + data.type + ' ' + data.name + '</div>';
                    popupContent += '<table class="popup-table">' +
                                        '<thead>' +
                                            '<tr>' +
                                                '<th>Дело</th>' +
                                                '<th>Листы</th>' +
                                                '<th>Помещик / Имение</th>' +
                                                '<th>Документ</th>' +
                                            '</tr>' +
                                        '</thead>' +
                                        '<tbody>';

                    data.records.forEach(function(rec) {
                        popupContent += '<tr>' +
                                            '<td>Ф.' + rec.fond + ', д.' + rec.delo + '</td>' +
                                            '<td>л.' + rec.pages + '</td>' +
                                            '<td>' + rec.owner + '<br><small style="color:gray">им. ' + rec.estate + '</small></td>' +
                                            '<td><a href="' + rec.url + '" target="_blank">Открыть ↗</a></td>' +
                                         '</tr>';
                    });

                    popupContent += '</tbody></table>';
                    
                    // Привязываем всплывающее окно к маркеру
                    marker.bindPopup(popupContent, { maxWidth: 380 });
                }

            } catch (error) {
                console.error("Ошибка инициализации карты: ", error);
            }
        });
    </script>
</body>
</html>
