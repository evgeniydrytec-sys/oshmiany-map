<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Карта Ошмянского уезда 1850</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #f4ece1;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            overflow: hidden;
            user-select: none;
        }
        .container {
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }
        .header-panel {
            background-color: #2c3e50;
            color: #fff;
            padding: 12px;
            text-align: center;
            font-size: 15px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            z-index: 10;
        }
        #map-container {
            flex: 1;
            position: relative;
            background-color: #d4bfa2;
            overflow: hidden;
        }
        #map-viewport {
            width: 2400px; /* Большая карта для перемещения */
            height: 1800px;
            position: absolute;
            transform-origin: 0 0;
            cursor: grab;
            background-color: #f2ebd9;
        }
        #map-viewport:active {
            cursor: grabbing;
        }
        #map-svg {
            width: 100%;
            height: 100%;
        }
        .grid-line {
            fill: none;
            stroke: #e3d5be;
            stroke-width: 1;
        }
        .village-marker {
            fill: #d32f2f;
            stroke: #fff;
            stroke-width: 2;
            cursor: pointer;
        }
        .village-label {
            fill: #2c3e50;
            font-size: 13px;
            font-weight: bold;
            text-anchor: middle;
            pointer-events: none;
        }
        .info-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.2);
            padding: 16px;
            transform: translateY(100%);
            transition: transform 0.3s ease-out;
            z-index: 100;
            max-height: 55%;
            overflow-y: auto;
        }
        .info-panel.active {
            transform: translateY(0);
        }
        .close-btn {
            float: right;
            background: #eee;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .popup-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #2c3e50;
        }
        .popup-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            margin-top: 10px;
        }
        .popup-table th, .popup-table td {
            border: 1px solid #e0e0e0;
            padding: 8px;
            text-align: left;
        }
        .popup-table th {
            background-color: #f5f5f5;
            color: #2c3e50;
        }
        .popup-table a {
            color: #1565c0;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-panel">🗺️ Генеалогический архив Ошмянского уезда</div>
        
        <div id="map-container">
            <div id="map-viewport">
                <svg id="map-svg">
                    <!-- Рисуем координатную сетку уезда -->
                    <defs>
                        <pattern id="map-grid" width="60" height="60" patternUnits="userSpaceOnUse">
                            <path d="M 60 0 L 0 0 0 60" class="grid-line"/>
                        </pattern>
                    </defs>
                    <rect width="100%" height="100%" fill="url(#map-grid)" />
                    
                    <!-- Река Вилия и притоки -->
                    <path d="M 100 300 Q 600 450 1100 250 T 2200 400" fill="none" stroke="#a0c4ff" stroke-width="4" opacity="0.7"/>
                    <path d="M 1100 250 Q 1200 600 1300 900" fill="none" stroke="#a0c4ff" stroke-width="2" opacity="0.5"/>
                    
                    <!-- Сюда скрипт добавит наши исторические селения -->
                    <g id="markers-group"></g>
                </svg>
            </div>
        </div>

        <div id="info-panel" class="info-panel">
            <button class="close-btn" onclick="closePanel()">✕</button>
            <div id="panel-content"></div>
        </div>
    </div>

    <script>
        // Данные вашей таблицы 1850 года
        const rawRecords = [
            { fond: "515", opis: "15", delo: "866", pages: "3об-4", owner: "Иосиф Улан", estate: "Клопаче", type: "двор", place: "Поляны" },
            { fond: "515", opis: "15", delo: "866", pages: "3об-5", owner: "Иосиф Улан", estate: "Клопаче", type: "деревня", place: "Клопаче" },
            { fond: "515", opis: "15", delo: "866", pages: "13об-16", owner: "Томаш Умястовский", estate: "Тальковщизна", type: "деревня", place: "Тальковщизна" },
            { fond: "515", opis: "15", delo: "866", pages: "21об-22", owner: "Авраам Улан", estate: "Поляны", type: "фольварок", place: "Поляны" },
            { fond: "515", opis: "15", delo: "866", pages: "21об-22", owner: "Авраам Улан", estate: "Поляны", type: "деревня", place: "Клопаче" },
            { fond: "515", opis: "15", delo: "866", pages: "29об-33", owner: "Антоний Умястовский", estate: "Бердовщизна", type: "деревня", place: "Сураж" },
            { fond: "515", opis: "15", delo: "866", pages: "419об-424", owner: "Михаил Хрептович", estate: "Вишнево", type: "местечко", place: "Вишнево" }
        ];

        // Фиксированные географические точки Ошмянского региона на холсте
        const positions = {
            "двор Поляны": {x: 400, y: 500},
            "деревня Клопаче": {x: 650, y: 420},
            "деревня Тальковщизна": {x: 950, y: 650},
            "фольварок Поляны": {x: 430, y: 560},
            "деревня Сураж": {x: 1300, y: 480},
            "местечко Вишнево": {x: 880, y: 950}
        };

        const placesOnMap = {};
        rawRecords.forEach(row => {
            const key = `${row.type} ${row.place}`.trim();
            if (!placesOnMap[key]) {
                const pos = positions[key] || {x: 600, y: 600};
                placesOnMap[key] = {
                    name: row.place,
                    type: row.type,
                    x: pos.x,
                    y: pos.y,
                    records: []
                };
            }
            placesOnMap[key].records.push(row);
        });

        const markersGroup = document.getElementById('markers-group');
        
        for (const key in placesOnMap) {
            const data = placesOnMap[key];
            const g = document.createElementNS("http://w3.org", "g");
            
            const circle = document.createElementNS("http://w3.org", "circle");
            circle.setAttribute("cx", data.x);
            circle.setAttribute("cy", data.y);
            circle.setAttribute("r", 10);
            circle.setAttribute("class", "village-marker");
            
            // Навешиваем обработчик клика, полностью совместимый с мобильным Telegram
            circle.addEventListener('click', function(e) {
                e.stopPropagation();
                showPanel(data);
            });
            
            const text = document.createElementNS("http://w3.org", "text");
            text.setAttribute("x", data.x);
            text.setAttribute("y", data.y - 16);
            text.setAttribute("class", "village-label");
            text.textContent = data.name;
            
            g.appendChild(circle);
            g.appendChild(text);
            markersGroup.appendChild(g);
        }

        function showPanel(data) {
            const panel = document.getElementById('info-panel');
            const content = document.getElementById('panel-content');
            
            let html = `<div class="popup-title">📍 ${data.type} ${data.name}</div>`;
            html += `<table class="popup-table">
                        <thead>
                            <tr>
                                <th>Шифр</th>
                                <th>Листы</th>
                                <th>Владелец / Имение</th>
                            </tr>
                        </thead>
                        <tbody>`;
            
            data.records.forEach(rec => {
                html += `<tr>
                            <td>Ф. ${rec.fond}, оп. 15, д. ${rec.delo}</td>
                            <td>${rec.pages}</td>
                            <td><b>${rec.owner}</b><br><span style="color:#795548">им. ${rec.estate}</span></td>
                         </tr>`;
            });
            html += `</tbody></table>`;
            
            content.innerHTML = html;
            panel.classList.add('active');
        }

        function closePanel() {
            document.getElementById('info-panel').classList.remove('active');
        }

        // --- УПРАВЛЕНИЕ КАРТОЙ ДЛЯ ТЕЛЕФОНОВ И ПК ---
        const container = document.getElementById('map-container');
        const viewport = document.getElementById('map-viewport');

        let isDragging = false;
        let startX, startY;
        let translateX = -200, translateY = -200; // Центрируем холст на экране

        viewport.style.transform = `translate(${translateX}px, ${translateY}px)`;

        // Логика перетаскивания мышкой (ПК)
        container.addEventListener('mousedown', (e) => {
