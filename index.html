<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Архив Ошмянского уезда</title>
    
    <!-- Подключаем 100% бесплатные библиотеки карт Leaflet, которым не нужны никакие ключи доступа -->
    <link rel="stylesheet" href="https://cloudflare.com" />
    <script src="https://cloudflare.com"></script>
    
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%;
            background-color: #f4ece1;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            overflow: hidden;
        }
        .container { display: flex; flex-direction: column; height: 100%; }
        .header-panel {
            background-color: #2c3e50; color: #fff; padding: 12px;
            text-align: center; font-size: 15px; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            z-index: 1000;
        }
        
        /* ВЕРХНЯЯ ПАНЕЛЬ С БЫСТРЫМ ПОИСКОМ ДЕРЕВЕНЬ */
        .search-panel {
            background-color: #fff; padding: 10px; border-bottom: 1px solid #d4bfa2;
            display: flex; gap: 8px; overflow-x: auto; white-space: nowrap;
            -webkit-overflow-scrolling: touch; z-index: 1000;
        }
        .place-link {
            display: inline-block; background-color: #f5f5f5; color: #2c3e50;
            padding: 8px 14px; border: 1px solid #ccc; border-radius: 20px;
            font-size: 13px; font-weight: bold; text-decoration: none; cursor: pointer;
        }
        .place-link:hover { background-color: #e0e0e0; }
        .place-link.active-btn { background-color: #d32f2f; color: white; border-color: #d32f2f; }

        /* БЛОК НАСТОЯЩЕЙ КАРТЫ */
        #map { flex: 1; width: 100%; height: 100%; z-index: 1; }

        /* ВСПЛЫВАЮЩИЕ ОКНА С АРХИВНЫМИ ТАБЛИЦАМИ */
        .popup-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
        .popup-table th, .popup-table td { border: 1px solid #e0e0e0; padding: 6px; text-align: left; }
        .popup-table th { background-color: #f5f5f5; color: #2c3e50; font-weight: bold; }
        .popup-title { font-size: 14px; font-weight: bold; color: #2c3e50; margin-bottom: 4px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-panel">📜 Гео-Архив: Ошмянский повет (1850)</div>
        
        <!-- Верхнее быстрое меню -->
        <div class="search-panel" id="buttons-container"></div>
        
        <!-- Настоящая карта местности -->
        <div id="map"></div>
    </div>

    <script type="text/javascript">
        // Реальная архивная база данных с привязанными GPS-координатами Ошмянского региона
        const rawRecords = [
            { fond: "515", delo: "866", pages: "3об-4", owner: "Иосиф Улан", estate: "Клопаче", type: "двор", place: "Поляны", lat: 54.4371, lng: 25.8752 },
            { fond: "515", delo: "866", pages: "3об-5", owner: "Иосиф Улан", estate: "Клопаче", type: "деревня", place: "Клопаче", lat: 54.4079, lng: 25.9691 },
            { fond: "515", delo: "866", pages: "13об-16", owner: "Томаш Умястовский", estate: "Тальковщизна", type: "деревня", place: "Тальковщизна", lat: 54.4891, lng: 25.9922 },
            { fond: "515", delo: "866", pages: "21об-22", owner: "Авраам Улан", estate: "Поляны", type: "фольварок", place: "Поляны", lat: 54.4371, lng: 25.8752 },
            { fond: "515", delo: "866", pages: "419об-424", owner: "Михаил Хрептович", estate: "Вишнево", type: "местечко", place: "Вишнево", lat: 54.1411, lng: 26.2139 },
            { fond: "515", delo: "866", pages: "29об-33", owner: "Антоний Умястовский", estate: "Бердовщизна", type: "деревня", place: "Сураж", lat: 54.0454, lng: 26.0125 }
        ];

        // 1. Инициализируем карту вокруг Ошмян
        const map = L.map('map').setView([54.4231, 25.9357], 10);

        // 2. Подключаем стабильную и красивую подложку карты местности (Voyager), работающую без ключей
        L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // 3. Группируем дубликаты записей по населенным пунктам
        const placesOnMap = {};
        rawRecords.forEach(row => {
            const key = row.place;
            if (!placesOnMap[key]) {
                placesOnMap[key] = {
                    name: row.place, lat: row.lat, lng: row.lng, markerRef: null, records: []
                };
            }
            placesOnMap[key].records.push(row);
        });

        const buttonsContainer = document.getElementById('buttons-container');

        // 4. Отрисовка маркеров и кнопок меню
        for (const key in placesOnMap) {
            const data = placesOnMap[key];

            // Собираем таблицу документов во всплывающее окошко маркера
            let popupContent = `<div class="popup-title">📍 Населенный пункт: <b>${data.name}</b></div>`;
            popupContent += `<table class="popup-table">
                                <thead>
                                    <tr>
                                        <th>Статус</th>
                                        <th>Архивный шифр</th>
                                        <th>Листы</th>
                                        <th>Помещик / Имение</th>
                                    </tr>
                                </thead>
                                <tbody>`;

            data.records.forEach(rec => {
                popupContent += `<tr>
                                    <td><b>${rec.type}</b></td>
                                    <td>Ф. ${rec.fond}, д. ${rec.delo}</td>
                                    <td>л. ${rec.pages}</td>
                                    <td>${rec.owner}<br><small style="color:gray">им. ${rec.estate}</small></td>
                                 </tr>`;
            });
            popupContent += `</tbody></table>`;

            // Ставим маркер на реальную карту местности
            const marker = L.marker([data.lat, data.lng]).addTo(map);
            marker.bindPopup(popupContent, { maxWidth: 380 });
            data.markerRef = marker; // Сохраняем ссылку

            // Создаем круглую кнопку в верхнем быстром меню
            const btn = document.createElement('div');
            btn.className = 'place-link';
            btn.innerText = '📍 ' + data.name;
            
            // Логика авто-подлета при клике на меню сверху
            btn.onclick = function() {
                document.querySelectorAll('.place-link').forEach(b => b.classList.remove('active-btn'));
                btn.classList.add('active-btn');
                
                // Карта плавно летит к реальной деревне
                map.flyTo([data.lat, data.lng], 13, { duration: 1.2 });
                
                // Автоматически открываем таблицу документов над этой деревней
                setTimeout(() => {
                    data.markerRef.openPopup();
                }, 1300);
            };

            buttonsContainer.appendChild(btn);
        }
    </script>
</body>
</html>
